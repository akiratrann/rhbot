# ============================================================
#  rhbot — ALPACA LIVE, REAL MONEY, $300 ACCOUNT
#
#      python preflight.py --config config.live.yaml    <- ALWAYS run first
#      python run.py --config config.live.yaml
#
#  Separate from config.yaml on purpose: that one is all-in on a $100k paper
#  account and those numbers must never reach a real one.
#
#  REQUIRES ALPACA_LIVE_API_KEY / ALPACA_LIVE_API_SECRET in .env. Paper keys
#  return 401 against the live host — they are a different credential pair.
#  Generate them at app.alpaca.markets with the account switcher set to LIVE.
# ============================================================

mode: live
broker: alpaca
alpaca_data_feed: iex

# MONITOR every 60s, but that is not the same as TRADING every 60s. Three
# separate gates decide whether a check becomes an order:
#
#   1. bar_interval — crypto reads 15m bars, equities 1d. The signal itself
#      only changes when a bar does, so minute polling sees an in-progress bar
#      move, not 1440 fresh opinions a day.
#   2. min_slope_pct — a flip smaller than the deadband is noise, not a turn.
#   3. min_seconds_between_trades — 900s per symbol, so even a genuine signal
#      cannot fire twice inside 15 minutes.
#
# Measured, and the reason bar_interval is NOT 1m: on 1-minute bars BTC's best
# config returned +6.55% against buy & hold's +21.99%. Finer bars lost money
# monotonically (15m +21.74%, 5m +15.15%, 1m +6.55%). Polling faster is free;
# DECIDING faster is what cost money.
poll_interval_seconds: 60

# ------------------------------------------------------------
#  DEFAULT bar size. Individual symbols override it (see the watchlist).
#
#  Equities stay at 1d because intraday round trips ARE day trades, and at
#  $300 that is 3 per 5 business days. Daily bars with overnight holds never
#  touch that budget. Measured: on 5m bars no equity config beat buy & hold
#  while staying under the cap.
# ------------------------------------------------------------
bar_interval: 1d
max_bar_age_minutes:

# ------------------------------------------------------------
#  ELEVEN slots at $22 = $242 if every one fills, against $300 of equity.
#
#  Sized from CASH, not equity: $60 is already in SMCI, leaving $240. Ten new
#  entries at $22 need $220, which clears with room. Sizing to the last dollar
#  makes the final order reject on any price move.
#
#  All four symbols that survived a two-fold walk-forward are now here: UNH,
#  LMT, SNOW, VZ. Of 117 screened, 56% beat buy & hold in one window and only
#  3% in both — that gap is the single-split illusion, measured.
#
#  MIXED BAR INTERVALS. Equities read daily bars; BTC and ETH read 15m. That
#  is possible because bar_interval is settable PER SYMBOL — earlier revisions
#  of this file said it was not, and that comment was stale.
#
#  Why the split: crypto is PDT-exempt, equities are not. At $300 the four
#  stocks are capped at 3 day trades per 5 business days by regulation, so
#  intraday bars would only generate signals they are forbidden to act on.
#  Crypto has no such cap, so it gets the fast lane.
#
#  params are read in BARS. `smooth: 5` means five DAYS on an equity and 75
#  MINUTES on BTC. Each symbol's numbers were tuned on the interval it runs.
#
#  Crypto costs, measured directly rather than assumed: BTC 2.7 bps spread,
#  ETH 3.4 bps, SMCI 2.6 bps. An earlier note here claimed 195 bps and removed
#  them; that figure came from Alpaca under-deploying one notional order and
#  was wrong. LTC IS excluded on cost — 59 bps, 20x BTC.
#
#  What to expect, honestly: at 25 bps/side over the 7-11 days of intraday
#  history Alpaca serves, BTC's best 15m config returned +21.74% against buy &
#  hold +21.88%, ETH +24.86% against +30.18%. A tie and a loss. Crypto is here
#  for frequency, not because an edge was demonstrated.
# ------------------------------------------------------------
watchlist:
  # semis | walk-forward edge +91.49% vs hold, 16 round trips, 27% max DD
  - symbol: SMCI
    asset_class: stock
    strategy: slope_reversal
    params:
      smooth: 2
      min_slope_pct: 0.01
    order_notional: 22.0

  # e-commerce | edge +40.51%, 8 round trips, 22.8% max DD
  - symbol: SHOP
    asset_class: stock
    strategy: slope_reversal
    params:
      smooth: 8
      min_slope_pct: 0.002
    order_notional: 22.0

  # tech/social | edge +19.37%, 18 round trips — the largest sample here
  - symbol: META
    asset_class: stock
    strategy: slope_reversal
    params:
      smooth: 3
      min_slope_pct: 0.002
    order_notional: 22.0

  # software | edge +17.72%, 6 round trips
  - symbol: MSFT
    asset_class: stock
    strategy: slope_reversal
    params:
      smooth: 3
      min_slope_pct: 0.005
    order_notional: 22.0

  # Survived a TWO-FOLD walk-forward: +53.43% and +21.01% edge over buy & hold
  # in two independent out-of-sample windows, 21.8% max drawdown. Only 4 of 117
  # screened symbols cleared both windows; this was the strongest.
  - symbol: UNH
    asset_class: stock
    strategy: slope_reversal
    params:
      smooth: 8
      min_slope_pct: 0.002
    order_notional: 22.0

  # Also cleared both folds: +14.27% and +23.85% edge, and the LOWEST drawdown
  # of any survivor at 11.0%. The steadiest name on this list.
  - symbol: LMT
    asset_class: stock
    strategy: slope_reversal
    params:
      smooth: 1
      min_slope_pct: 0.01
    order_notional: 22.0

  # ADDED BY REQUEST as a high-volatility day mover — a different selection
  # criterion from backtest edge, and a legitimate one. Its walk-forward record
  # is nonetheless the WORST of this list:
  #   test -60.21% vs buy & hold -43.84% (edge -16.38%), 65.3% max drawdown.
  # It lost money out of sample, lost to holding, and drew down two thirds.
  # The +119% figure associated with DUOL earlier was IN-SAMPLE — chosen after
  # seeing the answer. Sized the same as the others; at $40 a 65% drawdown is
  # about $26.
  - symbol: DUOL
    asset_class: stock
    strategy: slope_reversal
    params:
      smooth: 3
      min_slope_pct: 0.002
    order_notional: 22.0

  # Fourth two-fold survivor. HIGHEST RETURN of the four: +8.27% and +73.29%
  # in the two out-of-sample windows. Also the roughest — 38.7% max drawdown,
  # which is why an earlier version of this list excluded it. That exclusion
  # was my conservatism, not your instruction, and it is reversed here.
  - symbol: SNOW
    asset_class: stock
    strategy: slope_reversal
    params:
      smooth: 2
      min_slope_pct: 0.01
    order_notional: 22.0

  # Fourth-ranked survivor: +20.82% and +16.85% returns, 11.1% max drawdown.
  # Its worst-fold EDGE over buy & hold was only +2.70%, thin enough that it
  # could be noise. In on consistency, not on conviction.
  - symbol: VZ
    asset_class: stock
    strategy: slope_reversal
    params:
      smooth: 2
      min_slope_pct: 0.005
    order_notional: 22.0

  # PDT-EXEMPT, on 15-MINUTE bars — this is the unlimited-frequency slot.
  # 26 decisions per session instead of 1, and no day-trade budget to spend.
  # smooth=5 db=0.001 is the best config measured ON 15m bars (+21.74% vs
  # buy & hold +21.88%). Params are read in BARS, so these numbers only mean
  # what they should because bar_interval below says 15m.
  - symbol: BTC-USD
    asset_class: crypto
    strategy: slope_reversal
    bar_interval: 15m
    params:
      smooth: 5
      min_slope_pct: 0.001
    order_notional: 22.0

  # PDT-EXEMPT, 15-MINUTE bars. smooth=8 db=0.001 was its steadiest 15m config
  # (100% win rate on 4 trades — a tiny sample, so treat that as a shape, not
  # a forecast).
  - symbol: ETH-USD
    asset_class: crypto
    strategy: slope_reversal
    bar_interval: 15m
    params:
      smooth: 8
      min_slope_pct: 0.001
    order_notional: 22.0

# ------------------------------------------------------------
#  Risk limits — the last gate before any order. Tighten, don't loosen.
# ------------------------------------------------------------
risk:
  # Headroom above the $100 entry size. Exits skip this gate entirely (see
  # risk.py) so a winner can never grow too large to sell.
  max_order_notional: 35.0
  max_total_exposure: 300.0
  max_open_positions: 11
  # HALT EFFECTIVELY LIFTED at your request. -300 is the whole account, so on a
  # long-only cash account with no margin this can never trigger before there
  # is nothing left to protect.
  #
  # What still bounds the downside, and why lifting this is defensible here:
  #   - long-only, no margin, no shorting -> the account cannot go below $0
  #   - max_total_exposure caps deployed capital at the balance
  #   - state/STOP still halts everything instantly, from anywhere
  # What you gave up: the circuit breaker that catches a BUG. If a bad feed or
  # a broken strategy starts churning, nothing now stops it mid-day except you.
  max_daily_loss: -300.0
  # Panic button, works instantly even while you are travelling:
  #   touch state/STOP
  kill_switch_file: state/STOP
  # 15 minutes, matching the crypto bar size. At the old 14400 (4 hours) the
  # 15m crypto slots would have had 15 of every 16 signals suppressed, which
  # defeats the point of putting them on intraday bars. The equities are on
  # daily bars and produce at most one signal a day regardless, so loosening
  # this does not make them trade more.
  min_seconds_between_trades: 900

  # KEEP ON. At $300 you are far under the $25k threshold, so the 3-per-5-days
  # cap is real. The guard blocks new stock ENTRIES once the budget is spent;
  # exits are never blocked. Crypto is exempt and unaffected.
  pdt_guard: true
  max_day_trades_per_5_days: 3

dashboard:
  enabled: true
  host: 127.0.0.1
  # Different port so it runs alongside the paper bot on 5001.
  port: 5003

state_file: state/portfolio-live.json

logging:
  level: INFO
  file: logs/rhbot-live.log
