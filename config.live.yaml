# ============================================================
#  rhbot — ALPACA LIVE, REAL MONEY, $300 ACCOUNT
#
#      python preflight.py --config config.live.yaml    <- ALWAYS run first
#      python run.py --config config.live.yaml
#
#  Separate from config.yaml on purpose: that one is all-in on a $100k paper
#  account and those numbers must never reach a real one.
#
#  REQUIRES ALPACA_LIVE_API_KEY / ALPACA_LIVE_API_SECRET in .env. Paper keys
#  return 401 against the live host — they are a different credential pair.
#  Generate them at app.alpaca.markets with the account switcher set to LIVE.
# ============================================================

mode: live
broker: alpaca
alpaca_data_feed: iex

# 300s: with daily bars nothing changes minute to minute, and slower polling
# means far fewer connection timeouts on a slow link.
poll_interval_seconds: 300

# ------------------------------------------------------------
#  WHY DAILY BARS AND NOT INTRADAY
#
#  At $300 equity the Pattern Day Trader rule binds hard: 3 day trades per 5
#  business days, full stop. "Trade a lot each day" on STOCKS is not available
#  at this account size — not a config choice, a regulation.
#
#  Daily bars with overnight holds are not day trades, so they never touch that
#  budget. CRYPTO is exempt from PDT entirely and is the only slot here that
#  can trade as often as the signal fires.
#
#  Measured, not assumed: intraday sweeps on 5m bars found no config that beat
#  buy & hold while staying under 3 day trades/week (sweep_intraday.py).
# ------------------------------------------------------------
bar_interval: 1d
max_bar_age_minutes:

# ------------------------------------------------------------
#  $100 per slot, 3 slots = $300 fully deployed.
#  Symbols and params come from `python relearn.py` — walk-forward validated,
#  meaning params were chosen on a training window and scored on unseen data.
#  Re-run relearn.py weekly; it rewrites this list.
# ------------------------------------------------------------
# MIRRORS THE PAPER RUN: same five symbols, same params, scaled from $20,000
# per slot to $60. Alpaca supports fractional shares, so $60 of a $550 stock is
# a real position rather than a rounding error.
#
# Params are walk-forward validated — chosen on a training window, then scored
# on data the search never saw. Re-run `python relearn.py` weekly to refresh.
# FOUR slots at $75 = the full $300 deployed. Sized from BUYING POWER, not
# equity: with $60 already in SMCI there is $240 of cash, and 3 new entries at
# $75 need $225 of it. Five slots would have forced $48 each; three would mean
# more concentration per name. Four is the most capital at work without an
# order that cannot fill.
#
# T was dropped — lowest walk-forward edge of the five (+4.28% vs hold), so it
# was the cheapest slot to reclaim for size.
# SIX slots at $50 = the full $300.
#
# BTC and ETH are back, and the earlier note removing them was WRONG. It cited
# 195 bps of crypto cost, measured from a single fill where a $20,000 notional
# order deployed $19,609.95. That gap was Alpaca under-deploying a notional
# order as a safety buffer — a one-time entry effect — not spread or fees.
# Measured directly, the spreads are:
#     BTC 2.7 bps   ETH 3.4 bps   SMCI (equity) 2.6 bps
# Crypto here is no more expensive to trade than the stocks are.
#
# WHY THEY ARE IN: they are the only PDT-exempt instruments available. The four
# equities are capped at 3 day trades per 5 business days at this account size;
# these two are not, so they are the only slots that can act on every slope
# flip rather than a handful per week.
#
# WHAT TO EXPECT: at a realistic 25 bps/side over the 7-11 days of intraday
# history Alpaca serves, BTC's best config returned +21.74% against buy & hold
# +21.88%, and ETH +24.86% against +30.18%. A tie and a loss. They are here for
# frequency, not because they were shown to beat holding.
#
# NOTE the bar interval is still 1d for everything. Trading crypto on every
# intraday zero-crossing needs a SEPARATE process on 15m bars — see
# config.live.crypto.yaml. Mixing intervals in one config is not possible:
# `smooth: 5` would mean 5 days for the stocks and 75 minutes for the crypto.
#
# LTC and the smaller coins were NOT added: LTC's spread is 59 bps, 20x BTC's.
# Those genuinely are fee generators.
watchlist:
  # semis | walk-forward edge +91.49% vs hold, 16 round trips, 27% max DD
  - symbol: SMCI
    asset_class: stock
    strategy: slope_reversal
    params:
      smooth: 2
      min_slope_pct: 0.01
    order_notional: 50.0

  # e-commerce | edge +40.51%, 8 round trips, 22.8% max DD
  - symbol: SHOP
    asset_class: stock
    strategy: slope_reversal
    params:
      smooth: 8
      min_slope_pct: 0.002
    order_notional: 50.0

  # tech/social | edge +19.37%, 18 round trips — the largest sample here
  - symbol: META
    asset_class: stock
    strategy: slope_reversal
    params:
      smooth: 3
      min_slope_pct: 0.002
    order_notional: 50.0

  # software | edge +17.72%, 6 round trips
  - symbol: MSFT
    asset_class: stock
    strategy: slope_reversal
    params:
      smooth: 3
      min_slope_pct: 0.005
    order_notional: 50.0

  # PDT-EXEMPT, on 15-MINUTE bars — this is the unlimited-frequency slot.
  # 26 decisions per session instead of 1, and no day-trade budget to spend.
  # smooth=5 db=0.001 is the best config measured ON 15m bars (+21.74% vs
  # buy & hold +21.88%). Params are read in BARS, so these numbers only mean
  # what they should because bar_interval below says 15m.
  - symbol: BTC-USD
    asset_class: crypto
    strategy: slope_reversal
    bar_interval: 15m
    params:
      smooth: 5
      min_slope_pct: 0.001
    order_notional: 50.0

  # PDT-EXEMPT, 15-MINUTE bars. smooth=8 db=0.001 was its steadiest 15m config
  # (100% win rate on 4 trades — a tiny sample, so treat that as a shape, not
  # a forecast).
  - symbol: ETH-USD
    asset_class: crypto
    strategy: slope_reversal
    bar_interval: 15m
    params:
      smooth: 8
      min_slope_pct: 0.001
    order_notional: 50.0

# ------------------------------------------------------------
#  Risk limits — the last gate before any order. Tighten, don't loosen.
# ------------------------------------------------------------
risk:
  # Headroom above the $100 entry size. Exits skip this gate entirely (see
  # risk.py) so a winner can never grow too large to sell.
  max_order_notional: 75.0
  max_total_exposure: 300.0
  max_open_positions: 6
  # HALT EFFECTIVELY LIFTED at your request. -300 is the whole account, so on a
  # long-only cash account with no margin this can never trigger before there
  # is nothing left to protect.
  #
  # What still bounds the downside, and why lifting this is defensible here:
  #   - long-only, no margin, no shorting -> the account cannot go below $0
  #   - max_total_exposure caps deployed capital at the balance
  #   - state/STOP still halts everything instantly, from anywhere
  # What you gave up: the circuit breaker that catches a BUG. If a bad feed or
  # a broken strategy starts churning, nothing now stops it mid-day except you.
  max_daily_loss: -300.0
  # Panic button, works instantly even while you are travelling:
  #   touch state/STOP
  kill_switch_file: state/STOP
  # 15 minutes, matching the crypto bar size. At the old 14400 (4 hours) the
  # 15m crypto slots would have had 15 of every 16 signals suppressed, which
  # defeats the point of putting them on intraday bars. The equities are on
  # daily bars and produce at most one signal a day regardless, so loosening
  # this does not make them trade more.
  min_seconds_between_trades: 900

  # KEEP ON. At $300 you are far under the $25k threshold, so the 3-per-5-days
  # cap is real. The guard blocks new stock ENTRIES once the budget is spent;
  # exits are never blocked. Crypto is exempt and unaffected.
  pdt_guard: true
  max_day_trades_per_5_days: 3

dashboard:
  enabled: true
  host: 127.0.0.1
  # Different port so it runs alongside the paper bot on 5001.
  port: 5003

state_file: state/portfolio-live.json

logging:
  level: INFO
  file: logs/rhbot-live.log
