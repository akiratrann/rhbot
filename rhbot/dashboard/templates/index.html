<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rhbot dashboard</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0;
           background: #0f1115; color: #e6e6e6; }
    header { padding: 16px 24px; border-bottom: 1px solid #262a33;
             display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 18px; margin: 0; font-weight: 600; }
    .pill { padding: 3px 10px; border-radius: 999px; font-size: 12px;
            font-weight: 600; }
    .paper { background: #14351f; color: #7ee2a8; }
    .live  { background: #3a1414; color: #ff8a8a; }
    .halt  { background: #4a1d00; color: #ffb24d; }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
             gap: 12px; margin-bottom: 24px; }
    .card { background: #161922; border: 1px solid #262a33; border-radius: 10px;
            padding: 14px 16px; }
    .card .label { font-size: 12px; color: #8a90a0; text-transform: uppercase;
                   letter-spacing: .04em; }
    .card .value { font-size: 22px; font-weight: 650; margin-top: 4px; }
    .pos { color: #7ee2a8; } .neg { color: #ff8a8a; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 28px;
            font-size: 14px; }
    th, td { text-align: right; padding: 8px 10px;
             border-bottom: 1px solid #20242e; }
    th:first-child, td:first-child { text-align: left; }
    th { color: #8a90a0; font-weight: 600; font-size: 12px;
         text-transform: uppercase; }
    h2 { font-size: 14px; color: #8a90a0; text-transform: uppercase;
         letter-spacing: .04em; margin: 0 0 8px; }
    .muted { color: #6b7180; }
    .foot { font-size: 12px; color: #6b7180; margin-top: 24px; }
  </style>
</head>
<body>
  <header>
    <h1>rhbot</h1>
    <span id="mode" class="pill paper">paper</span>
    <span id="halt" class="pill halt" style="display:none">HALTED</span>
    <span class="muted" id="ticks"></span>
    <span class="muted" id="updated" style="margin-left:auto"></span>
  </header>
  <main>
    <div class="cards">
      <div class="card"><div class="label">Equity</div><div class="value" id="equity">—</div></div>
      <div class="card"><div class="label">Cash</div><div class="value" id="cash">—</div></div>
      <div class="card"><div class="label">Exposure</div><div class="value" id="exposure">—</div></div>
      <div class="card"><div class="label">Daily PnL</div><div class="value" id="daily">—</div></div>
      <div class="card"><div class="label">Unrealized</div><div class="value" id="unreal">—</div></div>
      <div class="card"><div class="label">Realized</div><div class="value" id="real">—</div></div>
    </div>

    <h2>Open positions</h2>
    <table>
      <thead><tr><th>Symbol</th><th>Qty</th><th>Avg</th><th>Last</th>
        <th>Value</th><th>Unrealized</th></tr></thead>
      <tbody id="positions"><tr><td colspan="6" class="muted">none</td></tr></tbody>
    </table>

    <h2>Recent fills</h2>
    <table>
      <thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Price</th></tr></thead>
      <tbody id="fills"><tr><td colspan="5" class="muted">none</td></tr></tbody>
    </table>

    <div class="foot" id="halt-reason"></div>
    <div class="foot">Read-only monitor. Auto-refreshes every 3s.
      Panic button: <code>touch state/STOP</code></div>
  </main>

  <script>
    const money = n => (n<0?'-':'') + '$' + Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2});
    const cls = n => n>0?'pos':(n<0?'neg':'');
    async function refresh() {
      try {
        const s = await (await fetch('/api/state')).json();
        const mode = document.getElementById('mode');
        mode.textContent = s.is_live ? 'LIVE' : 'paper';
        mode.className = 'pill ' + (s.is_live ? 'live' : 'paper');
        document.getElementById('halt').style.display = s.halted ? '' : 'none';
        document.getElementById('halt-reason').textContent = s.halted ? ('Halt reason: ' + s.halt_reason) : '';
        document.getElementById('ticks').textContent = 'tick #' + s.tick_count + ' · ' + s.broker;
        document.getElementById('updated').textContent = 'updated ' + new Date().toLocaleTimeString();

        document.getElementById('equity').textContent = money(s.equity);
        document.getElementById('cash').textContent = money(s.cash);
        document.getElementById('exposure').textContent = money(s.exposure);
        const daily = document.getElementById('daily');
        daily.textContent = money(s.daily_pnl); daily.className = 'value ' + cls(s.daily_pnl);
        const un = document.getElementById('unreal');
        un.textContent = money(s.unrealized_pnl); un.className = 'value ' + cls(s.unrealized_pnl);
        const re = document.getElementById('real');
        re.textContent = money(s.realized_pnl); re.className = 'value ' + cls(s.realized_pnl);

        const pos = document.getElementById('positions');
        pos.innerHTML = s.positions.length ? s.positions.map(p => `
          <tr><td>${p.symbol}</td><td>${p.quantity.toFixed(6)}</td>
          <td>${money(p.avg_price)}</td><td>${money(p.last_price)}</td>
          <td>${money(p.market_value)}</td>
          <td class="${cls(p.unrealized_pnl)}">${money(p.unrealized_pnl)}</td></tr>`).join('')
          : '<tr><td colspan="6" class="muted">none</td></tr>';

        const fills = document.getElementById('fills');
        fills.innerHTML = s.recent_fills.length ? s.recent_fills.map(f => `
          <tr><td>${new Date(f.ts).toLocaleTimeString()}</td><td>${f.symbol}</td>
          <td class="${f.side==='buy'?'pos':'neg'}">${f.side.toUpperCase()}</td>
          <td>${Number(f.quantity).toFixed(6)}</td><td>${money(f.price)}</td></tr>`).join('')
          : '<tr><td colspan="5" class="muted">none</td></tr>';
      } catch (e) { document.getElementById('updated').textContent = 'connection lost…'; }
    }
    refresh(); setInterval(refresh, 3000);
  </script>
</body>
</html>
